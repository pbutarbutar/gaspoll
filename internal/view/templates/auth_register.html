{{ define "auth_register.html" }}
{{ template "base.html" . }}
{{ define "content" }}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-semibold">Daftar Driver</h2>
    <p class="text-sm text-slate-500">Isi data dasar untuk mulai topup.</p>
    <form method="post" action="/register" class="mt-4 space-y-3">
        <div>
            <label class="text-sm text-slate-600">Nama</label>
            <input name="name" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" required>
        </div>
        <div>
            <label class="text-sm text-slate-600">Nomor HP</label>
            <input name="phone" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" required>
        </div>
        <div>
            <label class="text-sm text-slate-600">Jenis Kendaraan</label>
            <input name="vehicle_type" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="Motor / Mobil" required>
        </div>
        <div>
            <label class="text-sm text-slate-600">Password</label>
            <input type="password" name="password" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" required>
        </div>
        <button class="w-full rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Buat Akun</button>
    </form>
    <p class="mt-3 text-center text-sm text-slate-500">Sudah punya akun? <a class="text-emerald-700" href="/login">Masuk</a></p>
</div>
{{ end }}
{{ end }}
