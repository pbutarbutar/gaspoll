{{ define "content" }}
<div class="max-w-lg mx-auto glass rounded-2xl p-6">
  <h1 class="text-2xl font-semibold text-white mb-2">Masuk / Daftar Driver</h1>
  <p class="text-slate-200 text-sm mb-4">Gunakan nomor HP yang sama dengan akun driver Anda. Tidak perlu OTP, ini simulasi alur driver.</p>
  <form action="/login" method="post" class="space-y-3">
    <div>
      <label class="block text-sm text-slate-300">Nama</label>
      <input name="name" required class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10" placeholder="Budi Driver">
    </div>
    <div>
      <label class="block text-sm text-slate-300">Nomor HP</label>
      <input name="phone" required class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10" placeholder="081234567890">
    </div>
    <div>
      <label class="block text-sm text-slate-300">Jenis Kendaraan</label>
      <input name="vehicle" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10" placeholder="Motor / Mobil">
    </div>
    <button type="submit" class="w-full bg-emerald-500 text-slate-900 font-semibold rounded-lg py-2">Masuk Sekarang</button>
  </form>
</div>

{{ end }}

{{ define "login.html" }}
{{ template "layout" . }}
{{ end }}
