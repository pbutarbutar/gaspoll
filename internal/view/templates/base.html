{{ define "base.html" }}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}Gaspoll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="border-b bg-white">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
            <div class="flex items-center gap-2">
                <div class="h-10 w-10 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold">G</div>
                <div>
                    <p class="text-xl font-semibold">Gaspoll</p>
                    <p class="text-xs text-slate-500">Topup Driver &amp; Reward Bengkel</p>
                </div>
            </div>
            <nav class="flex gap-4 text-sm font-medium">
                <a href="/" class="text-slate-700 hover:text-emerald-600">Home</a>
                <a href="/dashboard" class="text-slate-700 hover:text-emerald-600">Dashboard</a>
                <a href="/mitra" class="text-slate-700 hover:text-emerald-600">Mitra</a>
                <a href="/admin/settlement" class="text-slate-700 hover:text-emerald-600">Settlement</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-8">
        {{ template "content" . }}
    </main>
</body>
</html>
{{ end }}
