{{ define "components/products.html" }}
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
{{ range .Products }}
    <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm flex flex-col justify-between">
        <div>
            <p class="text-xs uppercase text-emerald-600">{{ upper .Category }}</p>
            <h4 class="mt-1 text-lg font-semibold">{{ .Name }}</h4>
            <p class="text-sm text-slate-500">{{ .Provider }}</p>
            <p class="mt-3 text-xl font-bold text-slate-800">Rp {{ .Price }}</p>
        </div>
        <form class="mt-4 space-y-2" hx-post="/api/orders" hx-target="closest .toast" hx-swap="innerHTML">
            <input type="hidden" name="product_id" value="{{ .ID }}">
            <label class="block text-sm text-slate-600">Nomor tujuan</label>
            <input name="target" required class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" placeholder="0812xxxxx / ID driver">
            <label class="block text-sm text-slate-600">Channel pembayaran</label>
            <select name="channel" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
                <option value="qris">QRIS</option>
                <option value="va">Virtual Account</option>
                <option value="ewallet">E-Wallet</option>
            </select>
            <button type="submit" class="w-full rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-700">Checkout</button>
            <div class="toast text-xs text-emerald-700"></div>
        </form>
    </div>
{{ else }}
    <p class="text-slate-500">Belum ada produk aktif.</p>
{{ end }}
</div>
{{ end }}
