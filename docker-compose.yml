version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaspoll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  uptrace:
    image: uptrace/uptrace:latest
    restart: always
    environment:
      UPTRACE_DSN: http://uptrace:14317/?token=devtoken
    ports:
      - "14318:14318"

  app:
    build: .
    command: ["./server"]
    environment:
      APP_ENV: local
      HTTP_PORT: 1323
      DATABASE_URL: postgres://postgres:postgres@db:5432/gaspoll?sslmode=disable
      UPTRACE_DSN: http://uptrace:14317/?token=devtoken
      SESSION_SECRET: change-me
      JWT_SIGNING_KEY: change-me-too
    depends_on:
      - db
      - uptrace
    ports:
      - "1323:1323"

volumes:
  pgdata: {}
